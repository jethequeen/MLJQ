                       result:"toujours en attente — le PC ne tourne peut-être pas."};
        render();
      }
      return;
    }
    cmdPoll[slot] = setTimeout(function(){
      var setKey = PANEL.key;
      var num = (SETS.filter(function(x){ return x.key===setKey; })[0]||{}).number;
      google.script.run.withSuccessHandler(function(d){
        if(!(PANEL[slot] && PANEL[slot].key === key)) return;
        var c = d && d.cmds && d.cmds[action];
        if(c && c.key === key && (c.status === 'done' || c.status === 'error')){
          PANEL[slot] = {key:key, status:c.status, result:c.result || c.status};
          if(d.ok) PANEL.data = d;                   // the plan moved: take the new list
          render();
          return;
        }
        pollCmd(action, key, tries + 1);
      }).withFailureHandler(function(){ pollCmd(action, key, tries + 1); }).getRestants(num);
    }, 9000);
  }

  function panelHtml(s){
    var bi = bagIndexFor(PANEL.bag);              // end of numbered bag N, in plan-file terms
    var h = '<div class="panel"><div class="ph"><b>Sac '+PANEL.bag+' — restants</b>'
          + '<button class="mini" data-close="1">Fermer</button></div>';
    if(PANEL.loading) return h + '<div class="none">Chargement…</div></div>';
    if(PANEL.err) return h + '<div class="none">⚠ '+esc(PANEL.err)+'</div></div>';
    var d = PANEL.data || {restants:[], parts:[]};
    h += '<input id="restq" placeholder="Chercher une pièce…" value="'+esc(PANEL.q)+'">';
    // A placed leftover leaves the list, but its answer — the box or the Sac the PC just
    // decided — is the whole point, so it stays at the top of the panel until you move on.
    var dn = PANEL.done;
    if(dn && !(d.restants||[]).some(function(x){ return x.key === dn.key; })){
      h += (dn.status === 'done' || dn.status === 'error')
         ? '<div class="verdict '+(dn.status==='error'?'wait':'go')+'">'
           + (dn.status==='error'?'⚠ ':'✓ ')+esc(dn.result)+'</div>'
         : '<div class="verdict wait">⏳ Le PC place le restant dans le sac '+PANEL.bag+'…</div>';
    }
    var q = (PANEL.q||'').trim().toLowerCase();
    // Cataloguage en cours : l'inventaire n'est pas une liste de restants, c'est ce qui
    // reste a saisir. On ne le DEROULE donc pas — des centaines de lots qu'on n'a pas en
    // main — mais la recherche y va pleinement : c'est par la qu'on rattrape une erreur,
    // en retrouvant une piece mal saisie pour la placer dans le sac ou on est.
    var listeFermee = !!d.cataloguing && !q;
    var list = listeFermee ? [] : (d.restants||[]).filter(function(r){
      return !q || (r.name+' '+r.color+' '+r.id).toLowerCase().indexOf(q) >= 0;
    });
    if(list.length){
      list.forEach(function(r){ h += restRow(r, bi); });
    } else if(listeFermee){
      h += '<div class="none">Cataloguage en cours &#8212; '
         + (d.restants||[]).length + ' lot'+((d.restants||[]).length>1?'s':'')
         + ' pas encore saisi'+((d.restants||[]).length>1?'s':'')+'.<br>'
         + 'Cherche une pièce ci-dessus pour la placer dans ce sac.</div>';
    } else if(!q){
      h += '<div class="none">Aucun restant — tout est catalogué dans les sacs.</div>';
    }
    // Not in the leftovers? Then it is catalogued somewhere: say where.
    if(q){
      var hits = (d.parts||[]).filter(function(p){
        return (p.name+' '+p.color+' '+p.id).toLowerCase().indexOf(q) >= 0;
      }).slice(0, 12);
      if(!list.length && !hits.length){
        h += '<div class="none">Rien de ce nom dans ce set.</div>';
      } else if(hits.length){
        h += '<div class="none" style="padding-bottom:4px">'
           + (d.cataloguing ? 'Déjà catalogué — pièces du set :'
                            : 'Pas dans les restants — pièces du set :') + '</div>';
        hits.forEach(function(p){ h += partRow(p, bi); });
      }
    }
    return h + '</div>';
  }

  /** « Fait » — the leftover is in your hand at this bag, so the PC takes it off the
   *  inventory and puts it IN that bag, then re-plans. Dropping it from the inventory alone
   *  would lose the pieces (no other file of the set holds them, so the CFB master would
   *  ship short) and would leave the box question unanswered: the re-plan is what assigns
   *  the C / D box, and its remark is what comes back here. */
  function markDone(key){
    var d = PANEL.data; if(!d) return;
    var r = (d.restants||[]).filter(function(x){ return x.key===key; })[0];
    if(!r) return;
    var bi = bagIndexFor(PANEL.bag);
    // No confirm dialog: the row answers for itself (⏳ then the remark the PC decided), the
    // move is backed up, and it cannot change the piece count — a popup here was just noise.
    PANEL.done = {key:key, status:'pending', result:''};
    render();
    google.script.run.withSuccessHandler(function(res){
      if(res && res.ok){ pollCmd('restant_done', key); }
      else { toast('Refusé : '+((res&&res.error)||'?')); PANEL.done = null; render(); }
    }).withFailureHandler(function(e){
      toast('Échec : '+e.message); PANEL.done = null; render();
    }).queueCommand(PANEL.key, 'restant_done', {key:key, qty:r.qty, to_bag:bi});
  }

  // -- change phase (mirrors the desktop right-click menu) --
  var phaseKey = null;
  function openPhase(key){ phaseKey = key; document.getElementById('phasemodal').classList.remove('hidden'); }
  function setPhase(phase){
    var s = SETS.filter(function(x){return x.key===phaseKey;})[0];
    document.getElementById('phasemodal').classList.add('hidden');
    if(!s) return;
    if(phase==='ouverture'){ s.done=[]; s.sorting=false; }
    else if(phase==='trier'){ s.sorting=true; }
    else if(phase==='trie'){ s.done=[]; for(var b=1;b<=s.bags;b++) s.done.push(b); s.sorting=true; }
    render();
    google.script.run.withFailureHandler(function(e){ toast('Échec : '+e.message); load(); }).setPhase(s.key, phase);
  }

  /** « Séparation terminée » — le seul geste de la phase « Séparer les sacs ».
   *  Il n'annonce aucune phase : il note que le travail physique est fait, et la suivante
   *  (« Cataloguer ») se déduit des fichiers, comme tout le reste. */
  function finishSeparating(key, btn){
    btn.disabled = true; btn.textContent = '…';
    google.script.run.withSuccessHandler(function(r){
      if(!r || !r.ok){
        btn.disabled = false; btn.textContent = 'Séparation terminée';
        toast('Refusé : ' + ((r && r.error) || '?'));
        return;
      }
      toast('Sachets séparés — place au cataloguage');
      load();
    }).withFailureHandler(function(e){
      btn.disabled = false; btn.textContent = 'Séparation terminée';
      toast('Échec : ' + e.message);
    }).finishSeparating(key);
  }

  function queueAction(key, action){
    var s = SETS.filter(function(x){return x.key===key;})[0]; if(!s) return;
    var label = action==='restants' ? 'Appliquer restant' : 'Construire CFB';
    var msg = action==='build_cfb'
      ? '<b>Le set sera TERMINÉ :</b><br>• les copies sortent de l\'inventaire<br>'
        + '• le dossier part à la corbeille du PC (récupérable)<br><br>'
        + 'Rien n\'est touché si le courriel ne part pas.'
      : 'Le PC calculera les restants de ce set.';
    askConfirm(action==='build_cfb'
                 ? 'Construire le CFB et l\'envoyer ?' : 'Calculer les restants ?',
               msg + '<br><br>Le PC le fera dès qu\'il tourne.',
               action==='build_cfb' ? 'Oui, construire' : 'Oui, calculer',
               function(){ doQueueAction(s, key, action, label); });
  }

  function doQueueAction(s, key, action, label){
    s.cmd = {action:action, status:'pending', result:'en attente du PC'};
    render();
    google.script.run.withSuccessHandler(function(r){
      if(r && r.ok){ toast(label+' demandé ✓'); }
      else { toast('Refusé : '+((r&&r.error)||'?')); s.cmd=null; render(); }
    }).withFailureHandler(function(e){ toast('Échec : '+e.message); s.cmd=null; render(); }).queueCommand(key, action);
  }

  function toggleBag(key, bag){
    var s = SETS.filter(function(x){return x.key===key;})[0]; if(!s) return;
    var i = s.done.indexOf(bag);
    if(i>=0) s.done.splice(i,1); else s.done.push(bag);
    s.sorting = true;
    render();
    clearTimeout(saveTimers[key]);
    saveTimers[key] = setTimeout(function(){
      google.script.run.withFailureHandler(function(e){ toast('Échec sauvegarde : '+e.message); }).setBags(key, s.done);
    }, 400);
  }

  // ── Cataloguage par photo ───────────────────────────────────────────────────
  // La boucle ne quitte jamais le téléphone : photo → découpage dans un canvas → un appel
  // Brickognize par découpe → le candidat qui est ENCORE à l'inventaire du set. Le PC
  // n'entre en scène qu'à « Fermer la liste », par la file de commandes. Un aller-retour
  // par photo passerait par Drive, qui met « secondes à minutes » à propager une écriture :
  // vingt photos par sac, et on attendrait vingt minutes au lieu de cataloguer.

  // On ratisse LARGE chez Brickognize, parce que c'est l'inventaire qui filtre derrière.
  // Mesuré sur une photo dense de 47 pièces : deux découpes n'avaient AUCUN candidat du set
  // dans les cinq premiers, et la bonne réponse était au rang 17 (Brickognize confond
  // obstinément 10247 avec 2476, qui n'est pas dans cette boîte). Avec top_k=5 on les
  // perdait ; avec 20 elles sortent. Un candidat absent du set ne coûte rien — il est écarté.
  var BKZ_URL = 'https://api.brickognize.com/predict/parts/'
              + '?predict_color=true&top_k_items=20&top_k_colors=5'
              + '&min_similarity_items=0.10&min_similarity_colors=0.05';
  var BKZ_POOL = 3;            // appels en parallèle — l'API est gratuite et tenue par une
                               // seule personne : on ne la martèle pas.
  var SEG_W = 1100;            // largeur de travail du découpage. Les DÉCOUPES, elles, se
                               // prennent en pleine résolution : Brickognize a besoin du détail.
  var SEG_MARGIN = 0.12;       // marge autour de chaque boîte, en fraction de son grand côté
  var CROP_PX = 420;           // côté long de la découpe envoyée à Brickognize
  // Au-dessus de SURE_ITEM, la reconnaissance passe sans être signalée. 0,80 vient du
  // PREMIER ESSAI RÉEL, pas d'une estimation : au-dessus de 80 %, aucune pièce n'a eu besoin
  // d'être corrigée. Le seuil était à 0,60 avant, ce qui affichait en vert des pièces entre
  // 60 et 80 % dont personne n'avait vérifié qu'elles étaient justes.
  var SURE_ITEM = 0.80, SURE_COLOR = 0.45;
  var DEEP_RANK = 3;           // au-delà de ce rang, le repêchage est signalé : un choix pris
                               // au rang 17 à 0,28 pendant que le candidat brut est à 0,76 est
                               // juste assez souvent pour être gardé, et faux assez souvent
                               // pour mériter un coup d'œil.

  var CAT = {key:null, number:'', name:'', bag:'', data:null, loading:false, err:null,
             lots:{}, photos:0, stage:'idle', busy:'', shot:null, work:null, boxes:[], overlay:'',
             finds:[], open:null, q:'', cmd:null, cmdId:'', saving:false, all:false, confirm:''};

  function openCat(key, bag){
    var s = SETS.filter(function(x){ return x.key === key; })[0];
    if(!s) return;
    CAT = {key:key, number:s.number, name:s.name, bag:String(bag || ''), data:null,
           loading:true, err:null, lots:{}, photos:0, stage:'idle', busy:'', shot:null, work:null,
           boxes:[], overlay:'', finds:[], open:null, q:'', cmd:null, cmdId:'', saving:false, all:false, confirm:''};
    render();
    google.script.run.withSuccessHandler(function(d){
      if(CAT.key !== key) return;
      CAT.loading = false;
      if(!d || !d.ok){ CAT.err = (d && d.error) || 'inventaire indisponible'; render(); return; }
      CAT.data = d;
      // Une fermeture encore en vol reprend son attente : on a pu quitter la page entre le
      // moment où on a fermé la liste et celui où le PC l'a inscrite. Une fermeture déjà
      // terminée, elle, ne s'affiche pas — ce serait le succès d'un sac précédent.
      if(d.cmd && (d.cmd.status === 'pending' || d.cmd.status === 'running')){
        CAT.cmd = d.cmd; CAT.cmdId = d.cmd.id || ''; catPoll(0);
      }
      // Une liste déjà ouverte reprend là où elle s'était arrêtée, et c'est SON sac qui
      // compte : le téléphone reposé au milieu d'un sac ne doit pas en recommencer un
      // autre sans le dire.
      if(d.session && (d.session.lots || []).length){
        (d.session.lots || []).forEach(function(l){ CAT.lots[l.k] = l; });
        CAT.photos = Number(d.session.photos || 0);
        if(d.session.bag) CAT.bag = String(d.session.bag);
      }
      if(!CAT.bag) CAT.bag = (d.next_bags || ['1'])[0];
      render();
    }).withFailureHandler(function(e){
      if(CAT.key !== key) return;
      CAT.loading = false; CAT.err = e.message; render();
    }).getCatalogue(s.number);
  }

  function closeCat(){
    if(CAT.shot && CAT.shot.bmp && CAT.shot.bmp.close) try{ CAT.shot.bmp.close(); }catch(e){}
    CAT = {key:null, number:'', name:'', bag:'', data:null, loading:false, err:null,
           lots:{}, photos:0, stage:'idle', busy:'', shot:null, work:null, boxes:[], overlay:'',
           finds:[], open:null, q:'', cmd:null, cmdId:'', saving:false, all:false, confirm:''};
    render();
  }

  function catInv(){
    var m = {};
    ((CAT.data && CAT.data.lots) || []).forEach(function(l){ m[l.k] = l; });
    return m;
  }

  /** Combien de cette pièce l'inventaire tient ENCORE : ce que le PC a publié, moins ce que
   *  la liste en cours lui a déjà pris, moins ce que les découpes de la photo en cours vont
   *  lui prendre. `skip` exclut une découpe (la sienne, quand on règle sa quantité). */
  function catAvail(k, skip){
    var l = catInv()[k];
    if(!l) return 0;
    var used = CAT.lots[k] ? CAT.lots[k].qty : 0;
    CAT.finds.forEach(function(f){
      if(f === skip || f.drop || !f.pick) return;
      if(f.pick.lot.k === k) used += f.qty;
    });
    return Math.max(0, Number(l.qty || 0) - used);
  }

  function catPieces(){
    var n = 0;
    for(var k in CAT.lots) n += CAT.lots[k].qty;
    return n;
  }

  // ── Le découpage ────────────────────────────────────────────────────────────
  // CONTRAT : segBoxes(rgba, w, h) -> [{x, y, w, h, area, edge}] en pixels de TRAVAIL,
  // triées (y, x). Fonction PURE — ni DOM, ni canvas — pour qu'elle puisse se tester hors
  // navigateur contre la version Python qui a servi à la régler.
  //
  // `edge` ne fait pas JETER la boîte, il la SIGNALE : ce qui touche le bord du cadre est
  // soit le bord de la table, soit une main, soit une pièce coupée par le cadre. Dans les
  // trois cas il faut l'œil, pas une décision automatique.
  //
  // CE QUI SUIT EST UN PREMIER JET, réglé sur une seule photo synthétique, et il est destiné
  // à être remplacé par le portage de la segmentation réglée sur de VRAIES photos — fond
  // local par grille médiane en deux passes, seuils de luminance asymétriques (une ombre ne
  // va que vers le bas), séparation des pièces collées par dynamique de la carte de distance.
  // La signature est déjà celle-là pour que l'échange ne touche rien d'autre.

  /** Réduire la photo à la largeur de travail, par moyenne de zone calculée ICI.
   *
   *  Surtout pas `drawImage` pour réduire : son filtre n'est pas spécifié et change d'un
   *  navigateur à l'autre. Mesuré — mêmes photos, même découpage, deux réducteurs
   *  différents : 104 boîtes contre 94 sur les six photos de référence. Un dixième des
   *  pièces se perd dans le CHOIX DU RÉDUCTEUR. Ça ne se délègue donc pas à une
   *  implémentation qu'on ne contrôle pas, sinon le découpage réglé sur le bureau ne
   *  vaudrait plus rien sur le téléphone de quelqu'un d'autre.
   *
   *  La photo est lue par BANDES, à sa résolution native : une photo de téléphone fait
   *  douze millions de pixels, et la tenir entière en ImageData ferait cinquante mégaoctets.
   */
  /** Les pixels sources d'UN pixel de sortie, avec leur part de recouvrement.
   *  Les bords comptent AU PRORATA : un pixel à moitié couvert pèse une demi-part. Donner
   *  une part entière à un pixel de bord décale l'image d'un demi-pixel et coûte des pièces
   *  — mesuré, 95 boîtes au lieu de 104 sur les six photos de référence. */
  function segSpan(i, scale, n){
    var a = i * scale, b = (i + 1) * scale;
    var i0 = Math.floor(a), i1 = Math.min(n, Math.ceil(b));
    var idx = [], wt = [], sum = 0, k, ww;
    for(k = i0; k < i1; k++){
      ww = Math.min(k + 1, b) - Math.max(k, a);
      if(ww <= 0) continue;
      idx.push(k); wt.push(ww); sum += ww;
    }
    if(!idx.length){ idx.push(Math.min(n - 1, i0)); wt.push(1); sum = 1; }
    for(k = 0; k < wt.length; k++) wt[k] /= sum;
    return {idx:idx, wt:wt};
  }

  function catDownscale(bmp){
    var w = Math.min(SEG_W, bmp.width), h = Math.round(bmp.height * (w / bmp.width));
    var sx = bmp.width / w, sy = bmp.height / h;
    var out = new Uint8ClampedArray(w * h * 4);
    var cols = [];
    for(var cx = 0; cx < w; cx++) cols.push(segSpan(cx, sx, bmp.width));
    var cv = document.createElement('canvas');
    var ctx = cv.getContext('2d');
    var band = Math.max(1, Math.floor(4.0e6 / (bmp.width * Math.max(1, sy))));
    for(var y0 = 0; y0 < h; y0 += band){
      var y1 = Math.min(h, y0 + band);
      var s0 = Math.floor(y0 * sy), s1 = Math.min(bmp.height, Math.ceil(y1 * sy));
      var sh = Math.max(1, s1 - s0);
      cv.width = bmp.width; cv.height = sh;
      ctx.drawImage(bmp, 0, s0, bmp.width, sh, 0, 0, bmp.width, sh);
      var px = ctx.getImageData(0, 0, bmp.width, sh).data;
      for(var y = y0; y < y1; y++){
        var ry = segSpan(y, sy, bmp.height);
        for(var x = 0; x < w; x++){
          var rx = cols[x];
          var r = 0, g = 0, b = 0;
          for(var yy = 0; yy < ry.idx.length; yy++){
            var row = (ry.idx[yy] - s0) * bmp.width, wyv = ry.wt[yy];
            for(var xx = 0; xx < rx.idx.length; xx++){
              var o = (row + rx.idx[xx]) * 4, ww = wyv * rx.wt[xx];
              r += px[o] * ww; g += px[o + 1] * ww; b += px[o + 2] * ww;
            }
          }
          var q = (y * w + x) * 4;
          out[q] = r; out[q + 1] = g; out[q + 2] = b; out[q + 3] = 255;
        }
      }
    }
    return {rgba: out, w: w, h: h};
  }

  // Le découpage réglé sur six vraies photos de l'atelier (set 42226), porté depuis la
  // version Python qui a servi à le mettre au point. Vérifié boîte pour boîte contre elle :
  // 13 / 9 / 45 / 14 / 11 / 12 boîtes, identique sur les six, à pixels d'entrée égaux.
  //
  // Les constantes et le POURQUOI de chacune sont dans l'en-tête ci-dessous. Les trois qui
  // portent le résultat : le fond est LOCAL (grille médiane en deux passes, la seconde
  // recalculée en excluant ce que la première a jugé « pièce ») ; les seuils de luminance
  // sont ASYMÉTRIQUES, parce qu'une ombre ne va que vers le bas et que rien n'éclaircit le
  // fond ; et deux pièces collées se séparent par la DYNAMIQUE de la carte de distance,
  // relative à l'épaisseur de la pièce, jamais par une érosion à taille fixe.

  /* =====================================================================================
     DECOUPAGE D'UNE PHOTO DE PIECES — portage JS de segmentation_finale.py

     API :  segBoxes(rgba, w, h) -> [{x, y, w, h, area, edge}, ...]  (px de travail, trie y,x)

     `rgba` : Uint8ClampedArray RGBA de longueur w*h*4, DEJA reduite a la largeur de travail
     (~1100 px) par l'appelant. Fonction PURE : ni document, ni canvas, ni window.

     Tout est prefixe `seg`. ES5, aucun module, aucune dependance.

     Regle sur 6 photos reelles du set 42226. Sur la photo dense (47 pieces) : 45 decoupes,
     36 reconnues au rang 1 par Brickognize, 8 repechees par l'inventaire, 1 signalee.

     POURQUOI CHAQUE SEUIL EXISTE — ce sont des echecs mesures, pas des reglages de gout :
     * Les seuils de luminance sont ASYMETRIQUES parce qu'une ombre ne va QUE vers le bas
       (-20 a -35 %) et que rien n'eclaircit le fond. Symetrique a 0,34, la plaque Light
       Bluish Gray (+25 %) etait invisible.
     * L'ecart de teinte se mesure CONTRE LE FOND LOCAL, jamais en absolu : le gris de la
       table sous une lumiere chaude est teinte, et un seuil de saturation absolu mettait
       21,6 % de l'image en « couleur » — toute la zone eclairee devenait une seule piece.
     * La separation de deux pieces collees juge sur une DYNAMIQUE relative a l'epaisseur de
       la piece, jamais sur un nombre de pixels : en absolu, le meme reglage coupait une roue
       en gros plan et laissait collees deux plaques vues de loin.
     ===================================================================================== */

  var SEG_CELL = 55;          /* cote d'une cellule de la grille de fond */
  var SEG_MIN_FRAC = 0.20;    /* part de fond exigee dans une cellule pour qu'elle compte */
  var SEG_UP = 0.14;          /* une piece CLAIRE depasse le fond local de 14 % */
  var SEG_DOWN = 0.34;        /* une piece SOMBRE descend de 34 % sous le fond local */
  var SEG_DC = 0.115;         /* ecart de teinte au fond local */
  var SEG_OPEN_K = 3;         /* ouverture : tue le bruit */
  var SEG_CLOSE_K = 11;       /* fermeture : recolle tenons, bords et trous traversants */
  var SEG_BETA = 0.30;        /* dynamique exigee pour couper, RELATIVE a l'epaisseur */
  var SEG_H_MIN = 3;
  var SEG_MIN_CHILD = 0.15;   /* un enfant sous 15 % du parent est un eclat : reabsorbe */
  var SEG_MIN_AREA = 0.00030; /* fraction de l'image */
  var SEG_MAX_AREA = 0.25;

  /* --- mediane exacte par selection (meme definition que numpy : moyenne des deux du
         milieu quand le compte est pair). Destructif sur `v[0..n-1]`. ------------------- */
  function segSelect(v, lo, hi, k) {
      while (lo < hi) {
          var p = v[(lo + hi) >> 1], i = lo, j = hi, t;
          while (i <= j) {
              while (v[i] < p) i++;
              while (v[j] > p) j--;
              if (i <= j) { t = v[i]; v[i] = v[j]; v[j] = t; i++; j--; }
          }
          if (k <= j) hi = j; else if (k >= i) lo = i; else return v[k];
      }
      return v[lo];
  }

  function segMedian(v, n) {
      if (n <= 0) return NaN;
      var mid = n >> 1;
      var hi = segSelect(v, 0, n - 1, mid);
      if (n & 1) return hi;
      var lo = -Infinity;
      for (var i = 0; i < mid; i++) if (v[i] > lo) lo = v[i];
      return (lo + hi) / 2;
  }

  /* --- bornes de cellules : np.linspace(0, n, g+1).astype(int) ---------------------- */
  function segEdges(n, g) {
      var e = new Int32Array(g + 1);
      for (var i = 0; i <= g; i++) e[i] = Math.floor(i * n / g);
      return e;
  }

  /* --- agrandissement bilineaire, formule de cv2.resize INTER_LINEAR ---------------- */
  function segUpsample(grid, gw, gh, w, h) {
      var out = new Float32Array(w * h);
      var sx = gw / w, sy = gh / h;
      var xi = new Int32Array(w), xf = new Float32Array(w);
      var i, j;
      for (j = 0; j < w; j++) {
          var fx = (j + 0.5) * sx - 0.5, ix = Math.floor(fx), fr = fx - ix;
          if (ix < 0) { ix = 0; fr = 0; }
          if (ix >= gw - 1) { ix = gw - 2 < 0 ? 0 : gw - 2; fr = gw > 1 ? 1 : 0; }
          xi[j] = ix; xf[j] = fr;
      }
      for (i = 0; i < h; i++) {
          var fy = (i + 0.5) * sy - 0.5, iy = Math.floor(fy), fry = fy - iy;
          if (iy < 0) { iy = 0; fry = 0; }
          if (iy >= gh - 1) { iy = gh - 2 < 0 ? 0 : gh - 2; fry = gh > 1 ? 1 : 0; }
          var r0 = iy * gw, r1 = (iy + (gh > 1 ? 1 : 0)) * gw, o = i * w;
          for (j = 0; j < w; j++) {
              var a = xi[j], b = a + (gw > 1 ? 1 : 0), t = xf[j];
              var top = grid[r0 + a] + (grid[r0 + b] - grid[r0 + a]) * t;
              var bot = grid[r1 + a] + (grid[r1 + b] - grid[r1 + a]) * t;
              out[o + j] = top + (bot - top) * fry;
          }
      }
      return out;
  }

  /* --- fond local : mediane par cellule, trous combles par diffusion ---------------- */
  function segGridMedian(arr, w, h, keep, cell, minFrac) {
      var gh = Math.max(2, Math.floor(h / cell)), gw = Math.max(2, Math.floor(w / cell));
      var ys = segEdges(h, gh), xs = segEdges(w, gw);
      var grid = new Float32Array(gw * gh);
      var nan = new Uint8Array(gw * gh);
      var buf = new Float64Array(cell * cell * 4 + 16);
      var i, j, y, x, n, anyNan = 0;
      for (i = 0; i < gh; i++) {
          for (j = 0; j < gw; j++) {
              n = 0;

    var c = cv.getContext('2d');
    c.drawImage(bmp, 0, 0, cv.width, cv.height);
    // Les boîtes sont en pixels de TRAVAIL : l'échelle passe par la largeur de travail, pas
    // par celle de la photo.
    var kx = cv.width / CAT.work.w, ky = cv.height / CAT.work.h;
    c.lineWidth = Math.max(2, Math.round(W / 320));
    c.font = '700 ' + Math.round(W / 26) + 'px -apple-system, system-ui, sans-serif';
    CAT.boxes.forEach(function(b, i){
      // Vert : trouvée. Orange : touche le bord du cadre — bord de table, main, ou pièce
      // coupée, ça demande l'œil. Bleu : ajoutée au doigt.
      var col = b.manual ? '#2563eb' : (b.edge ? '#d97706' : '#16a34a');
      var x = b.x * kx, y = b.y * ky, w = b.w * kx, h = b.h * ky;
      c.strokeStyle = col;
      c.strokeRect(x, y, w, h);
      var t = String(i + 1), tw = c.measureText(t).width;
      c.fillStyle = col;
      c.fillRect(x, Math.max(0, y - W / 22), tw + W / 48, W / 22);
      c.fillStyle = '#fff';
      c.fillText(t, x + W / 96, Math.max(W / 28, y - W / 180));
    });
    return cv.toDataURL('image/jpeg', 0.8);
  }

  /** Le doigt sur la photo annotée : enlever la boîte touchée, ou en ajouter une là.
   *
   *  Aucun seuil ne récupère une pièce qui est à la MÊME luminance que la table sous
   *  l’ombre — sur la photo dense de référence il en reste deux sur 47, et baisser le seuil
   *  en fait perdre d’autres (44, puis 43). Un geste de deux secondes vaut mieux qu’un
   *  réglage qui dégrade le reste. Et le geste inverse sert autant : une boîte sur le bord
   *  de la table coûte un appel et une ligne « non reconnue ».
   */
  function catTap(fx, fy){
    var w = CAT.work.w, h = CAT.work.h;
    var px = fx * w, py = fy * h;
    for(var i = 0; i < CAT.boxes.length; i++){
      var b = CAT.boxes[i];
      if(px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h){
        CAT.boxes.splice(i, 1);
        CAT.overlay = catOverlay();
        render();
        toast('Boîte enlevée');
        return;
      }
    }
    var side = Math.round(w * 0.07);
    catAddManual(Math.round(px - side / 2), Math.round(py - side / 2), side, side);
    toast('Petit cadre posé — trace-le au doigt si la pièce dépasse');
  }

  /** Le cadre tracé au doigt, en fractions de l'image. */
  function catDraw(fx, fy, fw, fh){
    catAddManual(Math.round(fx * CAT.work.w), Math.round(fy * CAT.work.h),
                 Math.round(fw * CAT.work.w), Math.round(fh * CAT.work.h));
    toast('Cadre ajouté — il partira avec les autres');
  }

  function catAddManual(x, y, bw, bh){
    var w = CAT.work.w, h = CAT.work.h;
    bw = Math.max(8, Math.min(w, bw));
    bh = Math.max(8, Math.min(h, bh));
    CAT.boxes.push({x: Math.max(0, Math.min(w - bw, x)), y: Math.max(0, Math.min(h - bh, y)),
                    w: bw, h: bh, area: bw * bh, edge: false, manual: true});
    CAT.boxes.sort(function(p, q){ return (p.y - q.y) || (p.x - q.x); });
    CAT.overlay = catOverlay();
    render();
  }

  function catShot(file){
    CAT.stage = 'working'; CAT.busy = 'Analyse de la photo…'; CAT.finds = []; render();
    var done = function(bmp){
      CAT.shot = {bmp:bmp, w:bmp.width, h:bmp.height};
      // Le découpage BLOQUE le fil principal une à deux secondes sur un téléphone. Sans ce
      // setTimeout, le « Découpage… » qu'on vient de poser n'est jamais peint : le navigateur
      // n'a pas rendu la main entre le render() et le calcul, et l'écran reste figé sur la
      // vue précédente — ce qui a l'air cassé, pas occupé. Un Worker ferait mieux, mais il
      // passerait par un Blob URL que la CSP de l'iframe Apps Script peut refuser : on
      // déboguerait ça au lieu du cataloguage, pour une seconde.
      setTimeout(function(){ heavy(bmp); }, 0);
    };
    var heavy = function(bmp){
      try{
        var sm = catDownscale(bmp);
        CAT.work = {w:sm.w, h:sm.h};
        CAT.boxes = segBoxes(sm.rgba, sm.w, sm.h);
        if(!CAT.boxes.length){
          CAT.stage = 'idle'; CAT.busy = '';
          toast('Aucune pièce détectée — fond trop proche de la couleur des pièces ?');
          render(); return;
        }
        CAT.overlay = catOverlay();
        CAT.stage = 'segment'; CAT.busy = ''; render();
      }catch(e){
        CAT.stage = 'idle'; CAT.busy = ''; toast('Découpage impossible : ' + e.message); render();
      }
    };
    // `imageOrientation` : sans ça une photo prise en portrait arrive couchée, et chaque
    // découpe partirait tournée de 90° chez Brickognize.
    if(window.createImageBitmap){
      createImageBitmap(file, {imageOrientation:'from-image'}).then(done).catch(function(){
        createImageBitmap(file).then(done).catch(function(e){
          CAT.stage = 'idle'; toast('Photo illisible'); render();
        });
      });
    } else {
      var img = new Image();
      img.onload = function(){ done(img); };
      img.onerror = function(){ CAT.stage = 'idle'; toast('Photo illisible'); render(); };
      img.src = URL.createObjectURL(file);
    }
  }

  /** La découpe à envoyer, prise dans la PLEINE RÉSOLUTION : les boîtes sont en pixels de
   *  travail, mais Brickognize a besoin du détail, pas de la copie réduite où l'on a
   *  seulement cherché les pièces. On ne grossit jamais une découpe (k plafonné à 1) —
   *  interpoler n'ajoute aucun détail et ne fait que flouter. */
  function cropBlob(b){
    var sx = CAT.shot.w / CAT.work.w, sy = CAT.shot.h / CAT.work.h;
    var m = SEG_MARGIN * Math.max(b.w, b.h);
    var x0 = Math.max(0, Math.round((b.x - m) * sx));
    var y0 = Math.max(0, Math.round((b.y - m) * sy));
    var x1 = Math.min(CAT.shot.w, Math.round((b.x + b.w + m) * sx));
    var y1 = Math.min(CAT.shot.h, Math.round((b.y + b.h + m) * sy));
    var sw = Math.max(1, x1 - x0), sh = Math.max(1, y1 - y0);
    var cv = document.createElement('canvas');
    var k = Math.min(1, CROP_PX / Math.max(sw, sh));
    cv.width = Math.max(32, Math.round(sw * k));
    cv.height = Math.max(32, Math.round(sh * k));
    cv.getContext('2d').drawImage(CAT.shot.bmp, x0, y0, sw, sh, 0, 0, cv.width, cv.height);
    return new Promise(function(res){
      if(cv.toBlob) cv.toBlob(function(bl){ res({blob:bl, url:cv.toDataURL('image/jpeg', 0.6)}); },
                              'image/jpeg', 0.88);
      else res({blob:null, url:cv.toDataURL('image/jpeg', 0.88)});
    });
  }

  function bkz(blob){
    var fd = new FormData();
    fd.append('query_image', blob, 'piece.jpg');
    return fetch(BKZ_URL, {method:'POST', body:fd}).then(function(r){
      if(!r.ok) throw new Error('Brickognize ' + r.status);
      return r.json();
    });
  }

  /** Le candidat retenu est le mieux noté qui est ENCORE à l'inventaire du set.
   *
   *  C'est tout l'intérêt : le candidat n°1 brut confond le noir et le gris foncé, le blanc
   *  et le gris clair. Mais on sait ce que la boîte contient, donc on ne choisit que
   *  là-dedans. Et quand une pièce n'y est que dans UNE couleur, la prédiction de couleur
   *  ne sert plus à rien : s'y fier ne pourrait que faire rater la pièce. */
  function catMatch(res, inv){
    var items = (res && res.items) || [], cols = (res && res.colors) || [], pairs = [];
    items.forEach(function(it, rank){
      if(it.type !== 'part' && it.type !== 'sticker') return;
      var mine = [];
      for(var k in inv){
        if(String(inv[k].id) === String(it.id) && catAvail(k) > 0) mine.push(inv[k]);
      }
      if(!mine.length) return;
      if(mine.length === 1){
        pairs.push({lot:mine[0], si:it.score, cs:1, deduced:true, item:it,
                    rank:rank, crank:0});
        return;
      }
      var hit = false;
      cols.forEach(function(c, cr){
        mine.forEach(function(l){
          if(String(l.color) === String(c.id)){
            pairs.push({lot:l, si:it.score, cs:c.score, item:it, rank:rank, crank:cr});
            hit = true;
          }
        });
      });
      // La pièce est au set, mais dans aucune des couleurs prédites : on la propose quand
      // même, en bas de liste. La déclarer absente ferait recommencer une photo qui est bonne.
      if(!hit) mine.forEach(function(l){
        pairs.push({lot:l, si:it.score, cs:0.12, item:it, rank:rank, crank:cols.length});
      });
    });
    pairs.forEach(function(p){
      p.score = p.si * (0.35 + 0.65 * p.cs);
      // « Repêchée » : le choix n'est pas le candidat brut de Brickognize, c'est l'inventaire
      // du set qui l'a remonté. Un repêchage PROFOND (rang 17 à 0,28 pendant que le brut est
      // à 0,76) est juste assez souvent pour être gardé, et faux assez souvent pour mériter
      // un coup d'œil — donc il se dit, il ne se cache pas.
      p.rescued = (p.rank > 0 || p.crank > 0);
      p.deep = (p.rank + 1) > DEEP_RANK;
    });
    pairs.sort(function(a, b){ return b.score - a.score; });
    return pairs.slice(0, 8);
  }

  /** POURQUOI cette ligne est à vérifier. Vide = elle ne l'est pas.
   *
   *  Le pourcentage affiché est la note de la PIÈCE chez Brickognize, et elle seule — ce qui
   *  trompait : une ligne à 88 % pouvait être signalée sans qu'on voie pourquoi. Les quatre
   *  autres causes n'entrent pas dans ce chiffre, donc elles se disent en toutes lettres. */
  function findWhy(f){
    if(!f.pick) return ['aucun candidat du set'];
    var p = f.pick, why = [];
    if(p.si < SURE_ITEM) why.push('pièce à ' + Math.round(p.si * 100) + ' %');
    if(!p.deduced && !p.manual && p.cs < SURE_COLOR){
      why.push('couleur à ' + Math.round(p.cs * 100) + ' %');
    }
    if(p.deep) why.push('repêchée au rang ' + (p.rank + 1));
    if(f.edge) why.push('touche le bord du cadre');
    // PAS la couverture de la boîte de Brickognize : mesuré, une pièce seule n'en couvre que
    // 50 %, donc tout seuil là-dessus signalerait tout. Le cadre sur la vignette informe par
    // sa POSITION — il n'entoure qu'une pièce sur une découpe qui en contient deux — et c'est
    // l'œil qui le lit, pas un seuil.
    return why;
  }

  function findStatus(f){
    if(!f.pick) return 'absent';
    return findWhy(f).length ? 'doubt' : 'ok';
  }

  /** De quoi trier : la moins sûre en premier. Une ligne sans candidat passe devant tout. */
  function findRank(f){
    if(!f.pick) return -1;
    var p = f.pick;
    return Math.min(p.si, (p.deduced || p.manual) ? 1 : p.cs) - (p.deep ? 0.5 : 0)
           - (f.edge ? 0.3 : 0);
  }

  function catRecognise(){
    CAT.stage = 'working';
    var boxes = CAT.boxes, out = new Array(boxes.length), next = 0, live = 0, ended = 0;
    CAT.busy = 'Reconnaissance 0/' + boxes.length; render();
    function pump(){
      while(live < BKZ_POOL && next < boxes.length){
        live++;
        (function(i){
          cropBlob(boxes[i]).then(function(c){
            out[i] = {crop:c.url};
            if(!c.blob) throw new Error('découpe illisible');
            return bkz(c.blob);
          }).then(function(r){
            out[i].res = r;
          }).catch(function(e){
            out[i] = out[i] || {};
            out[i].err = e.message;
          }).then(function(){
            live--; ended++;
            CAT.busy = 'Reconnaissance ' + ended + '/' + boxes.length;
            if(ended === boxes.length) finish(); else { render(); pump(); }
          });
        })(next++);
      }
    }
    function finish(){
      // On apparie DANS L'ORDRE des découpes, pas dans l'ordre des réponses : la quantité
      // encore disponible dépend de ce que les découpes précédentes ont déjà réservé, donc
      // un ordre qui change d'une fois à l'autre donnerait un résultat qui change aussi.
      var inv = catInv();
      CAT.finds = [];
      out.forEach(function(o, i){
        o = o || {};
        var pairs = o.res ? catMatch(o.res, inv) : [];
        // La boîte que Brickognize a lui-même détectée DANS la découpe. C'est ce qu'il a
        // vraiment regardé : sur une découpe qui contient deux pièces, elle n'en entoure
        // qu'une, et ça se voit d'un coup d'œil. Elle est en pixels de l'image envoyée,
        // donc on la garde en fractions.
        var bb = o.res && o.res.bounding_box, box = null;
        if(bb && bb.image_width > 0 && bb.image_height > 0){
          box = {l:bb.left / bb.image_width, u:bb.upper / bb.image_height,
                 r:bb.right / bb.image_width, d:bb.lower / bb.image_height,
                 ar:bb.image_width / bb.image_height};
          box.cover = Math.max(0, (box.r - box.l)) * Math.max(0, (box.d - box.u));
        }
        var f = {i:i + 1, crop:o.crop || '', err:o.err || '', pairs:pairs,
                 pick:pairs[0] || null, qty:1, drop:false, bb:box,
                 edge: !!(boxes[i] && boxes[i].edge)};
        CAT.finds.push(f);
      });
      CAT.stage = 'review'; CAT.busy = ''; CAT.open = null; render();
    }
    pump();
  }

  function catAddFinds(){
    var n = 0, pieces = 0;
    CAT.finds.forEach(function(f){
      if(f.drop || !f.pick || f.qty <= 0) return;
      var l = f.pick.lot, k = l.k;
      if(CAT.lots[k]) CAT.lots[k].qty += f.qty;
      else CAT.lots[k] = {k:k, id:l.id, color:l.color, name:l.name, color_name:l.color_name,
                          qty:f.qty, score:Math.round((f.pick.score || 0) * 100) / 100};
      n++; pieces += f.qty;
    });
    var absent = CAT.finds.filter(function(f){ return !f.drop && !f.pick; }).length;
    if(!n){ toast('Rien à ajouter'); return; }
    CAT.photos++;
    CAT.finds = []; CAT.boxes = []; CAT.overlay = ''; CAT.stage = 'idle';
    catSave(function(){
      toast(pieces + ' pièce(s) ajoutée(s) au sac ' + CAT.bag
            + (absent ? ' — ' + absent + ' non reconnue(s), à faire à la main' : ''));
    });
  }

  /** Enregistrer la liste après chaque photo. C'est le seul filet : le `localStorage` vit
   *  sur le sous-domaine d'Apps Script, qui tourne, et une heure de saisie partirait avec. */
  function catSave(then){
    CAT.saving = true; render();
    var lots = [];
    for(var k in CAT.lots) lots.push(CAT.lots[k]);
    google.script.run.withSuccessHandler(function(r){
      CAT.saving = false;
      if(!r || !r.ok) toast('⚠ liste non enregistrée : ' + ((r && r.error) || '?'));
      render();
      if(then) then();
    }).withFailureHandler(function(e){
      CAT.saving = false; toast('⚠ liste non enregistrée : ' + e.message); render();
    }).saveCatSession(CAT.number, CAT.bag, lots, CAT.photos);
  }

  function catClose(){
    var pieces = catPieces();
    if(!pieces){ toast('La liste est vide'); return; }
    CAT.confirm = '';
    CAT.saving = true; render();
    google.script.run.withSuccessHandler(function(r){
      CAT.saving = false;
      if(!r || !r.ok){ toast((r && r.error) || 'refusé'); render(); return; }
      CAT.cmdId = r.id || '';
      CAT.cmd = {id:CAT.cmdId, status:'pending', result:'', bag:CAT.bag};
      render();
      catPoll(0);
    }).withFailureHandler(function(e){
      CAT.saving = false; toast('Erreur : ' + e.message); render();
    }).closeCatBag(CAT.key, CAT.number, CAT.bag);
  }

  var catTimer = null;
  function catPoll(tries){
    clearTimeout(catTimer);
    if(tries > 20){          // ~3 min : le PC ne tourne probablement pas
      CAT.cmd = {status:'error', result:'toujours en attente — le PC ne tourne peut-être pas.'};
      render(); return;
    }
    catTimer = setTimeout(function(){
      google.script.run.withSuccessHandler(function(d){
        if(!CAT.key) return;
        var c = d && d.cmd;
        if(c && c.id === CAT.cmdId && (c.status === 'done' || c.status === 'error')){
          CAT.cmd = c;
          if(c.status === 'done'){
            // Le sac est écrit et l'inventaire décrémenté : la liste en cours n'existe plus,
            // et l'instantané qu'on vient de relire est celui d'APRÈS.
            CAT.lots = {}; CAT.photos = 0;
            if(d.ok){ CAT.data = d; CAT.bag = (d.next_bags || ['1'])[0]; }
            load(true);                    // la carte du set doit suivre (pastille, sacs)
          }
          render(); return;
        }
        catPoll(tries + 1);
      }).withFailureHandler(function(){ catPoll(tries + 1); }).getCatalogue(CAT.number);
    }, 8000);
  }

  // ── L'écran ─────────────────────────────────────────────────────────────────

  /** La vignette d'une découpe, avec la boîte que Brickognize a réellement regardée dedans.
   *
   *  C'est le seul moyen de VOIR une fusion. Deux pièces dans une même découpe donnent une
   *  réponse unique et confiante — mesuré : deux plaques collées rendent « Plate 1 x 8 » à
   *  0,87, pendant que la seconde pièce disparaît sans un mot. Le score ne le dit pas,
   *  l'inventaire non plus si la pièce fantôme est dans la boîte. Mais le cadre, lui,
   *  n'entoure qu'une des deux, et ça se voit.
   *
   *  Aucun seuil là-dessus, et surtout pas de couleur qui ferait verdict : mesuré, une
   *  fusion couvre 40 % de la découpe contre 50 et 51 % pour les pièces seules. Tout seuil
   *  signalerait donc la quasi-totalité des lignes. Ce qui se lit, c'est la POSITION du
   *  cadre, pas sa taille — et ça se lit à l'œil, en une demi-seconde.
   */
  function catThumb(f){
    if(!f.crop) return '<span class="cw" style="width:46px;height:46px"></span>';
    var ar = (f.bb && f.bb.ar) || 1;
    var cw = ar >= 1 ? 46 : Math.round(46 * ar);
    var ch = ar >= 1 ? Math.round(46 / ar) : 46;
    var h = '<span class="cw" style="width:' + cw + 'px;height:' + ch + 'px">'
          + '<img src="' + f.crop + '">';
    if(f.bb){
      var b = f.bb;
      h += '<span class="bb" style="left:'
         + (b.l * 100).toFixed(1) + '%;top:' + (b.u * 100).toFixed(1) + '%;width:'
         + ((b.r - b.l) * 100).toFixed(1) + '%;height:' + ((b.d - b.u) * 100).toFixed(1)
         + '%"></span>';
    }
    return h + '</span>';
  }

  /** Les noms de sacs à proposer, lus dans ceux qui existent.
   *
   *  `next` : le prochain GROS sac. `subs` : pour chaque gros déjà commencé, son prochain
   *  petit (1 seul → « 1 - 1 » ; 3 et 3-1 → « 3 - 2 »). Le PC n'en publie que deux dans
   *  `next_bags`, ceux du plus grand numéro ; ici on les a tous, parce que rien n'oblige à
   *  finir le sac 3 avant d'ajouter un petit sac au 1. */
  function catBagChoices(d){
    var mains = {}, rx = /^\s*(\d+)\s*(?:-\s*(\d+)\s*)?$/;
    (d.bags || []).forEach(function(b){
      var m = rx.exec(b);
      if(!m) return;
      var n = parseInt(m[1], 10), s = m[2] ? parseInt(m[2], 10) : 0;
      if(!(n in mains) || s > mains[n]) mains[n] = s;
    });
    var nums = Object.keys(mains).map(Number).sort(function(a, b){ return a - b; });
    return {
      next: String((nums.length ? nums[nums.length - 1] : 0) + 1),
      subs: nums.map(function(n){ return n + ' - ' + (mains[n] + 1); }),
      done: (d.bags || []).slice()
    };
  }

  function catFindHtml(f){
    var st = findStatus(f);
    var h = '<div class="find ' + (f.drop ? 'off' : st) + '">';
    h += '<span class="fno">' + f.i + '</span>';
    h += catThumb(f);
    if(f.pick){
      var l = f.pick.lot, pc = Math.round(f.pick.si * 100);
      var cls = f.pick.si >= SURE_ITEM ? 'good' : (f.pick.si >= 0.4 ? 'mid' : 'bad');
      // Le MOTIF d'abord quand il y en a un : c'est ce qu'on est venu lire. Sinon, la note
      // utile (couleur déduite, choisie à la main) — et rien du tout si tout va de soi.
      var why = findWhy(f), note = why.slice();
      if(!why.length){
        if(f.pick.deduced) note.push('couleur déduite');
        if(f.pick.manual) note.push('choisie à la main');
      }
      h += '<button class="ft" data-cand="' + f.i + '">' + esc(l.name || l.id)
         + '<span>' + esc(l.color_name || ('couleur ' + l.color)) + ' · ' + esc(l.id)
         + (note.length ? ' · ' + esc(note.join(' · ')) : '') + '</span></button>';
      h += '<span class="sc ' + cls + '">' + pc + '%</span>';
      h += '<span class="qty"><button data-less="' + f.i + '">−</button><b>' + f.qty
         + '</b><button data-more="' + f.i + '">+</button></span>';
    } else {
      h += '<button class="ft" data-cand="' + f.i + '">Non reconnue'
         + '<span>' + esc(f.err || 'aucun candidat n’est encore à l’inventaire')
         + ' — choisis-la à la main</span></button>';
    }
    h += '<button class="qty" data-drop="' + f.i + '" style="border:0;background:none;'
       + 'color:var(--mute);font-size:17px;padding:0 2px">'
       + (f.drop ? '↺' : '✕') + '</button>';
    h += '</div>';
    if(CAT.open === f.i){
      (f.pairs || []).forEach(function(p, i){
        var on = (f.pick === p);
        h += '<button class="cand' + (on ? ' on' : '') + '" data-pick="' + f.i + ':' + i + '">'
           + '<img src="' + partImg({type:p.lot.type, color_id:p.lot.color, id:p.lot.id})
           + '" onerror="this.style.visibility=&quot;hidden&quot;">'
           + '<span class="ct">' + esc(p.lot.name || p.lot.id)
           + '<span>' + esc(p.lot.color_name || '') + ' · reste ' + catAvail(p.lot.k, f)
           + (p.deduced ? ' · seule couleur au set' : '') + '</span></span>'
           + '<span class="sc">' + Math.round(p.si * 100) + '/'
           + Math.round(p.cs * 100) + '</span></button>';
      });
      h += '<input class="ebar" id="catq" placeholder="…ou cherche dans l’inventaire" '
         + 'value="' + esc(CAT.q) + '">';
      if(CAT.q.trim()){
        var q = fold(CAT.q.trim()), inv = catInv(), hits = [];
        for(var k in inv){
          var l = inv[k];
          if(catAvail(k, f) <= 0) continue;
          if(fold(l.name + ' ' + l.id + ' ' + l.color_name).indexOf(q) >= 0) hits.push(l);
        }
        hits.slice(0, 12).forEach(function(l){
          h += '<button class="cand" data-manual="' + f.i + ':' + esc(l.k) + '">'
             + '<img src="' + partImg({type:l.type, color_id:l.color, id:l.id})
             + '" onerror="this.style.visibility=&quot;hidden&quot;">'
             + '<span class="ct">' + esc(l.name || l.id) + '<span>'
             + esc(l.color_name || '') + ' · reste ' + catAvail(l.k, f)
             + '</span></span></button>';
        });
        if(!hits.length) h += '<div class="hint">Rien de tel dans ce qui reste à cataloguer.</div>';
      }
    }
    return h;
  }

  function renderCat(app){
    var h = '<button class="cback" data-cat-back="1">‹ Retour</button>';
    h += '<div class="card">';
    h += '<div class="row1"><img class="thumb" src="' + imgUrl(CAT.number)
       + '" onerror="this.style.visibility=&quot;hidden&quot;">'
       + '<div class="name">' + esc(CAT.name) + '<span class="hint2">Cataloguage par photo'
       + (CAT.bag ? ' — sac ' + esc(CAT.bag) : '') + '</span></div></div>';

    if(CAT.loading){ h += '<div class="center">Chargement&#8230;</div></div>'; app.innerHTML = h; return; }
    if(CAT.err){ h += '<div class="rep bad">' + esc(CAT.err) + '</div></div>'; app.innerHTML = h; wireCat(app); return; }

    var d = CAT.data || {};
    h += '<div class="ctally">'
       + '<div><i>Au sac</i><b>' + catPieces() + '</b></div>'
       + '<div><i>Photos</i><b>' + CAT.photos + '</b></div>'
       + '<div><i>Reste au set</i><b>' + ((d.inv_qty || 0) - catPieces()) + '</b></div>'
       + '</div>';

    // Le choix du sac : la suite du sac en cours, ou le suivant. Rien dans les fichiers
    // ne dit lequel — ça dépend d'un fait physique, donc c'est à nous de trancher.
    if(!catPieces() && CAT.stage === 'idle'){
      // Les DEUX vrais choix d'abord, séparés, parce que ce sont deux gestes physiques
      // différents : ou bien on entame le gros sac suivant, ou bien on fait un petit sac de
      // plus dans un gros déjà commencé. Une liste plate mêlait les deux aux sacs déjà faits.
      var ch = catBagChoices(d);
      h += '<div class="lbl" style="margin-top:12px">Prochain gros sac</div>'
         + '<div class="frow"><button class="fchip' + (CAT.bag === ch.next ? ' on' : '')
         + '" data-bag="' + esc(ch.next) + '">' + esc(ch.next) + '</button></div>';
      if(ch.subs.length){
        h += '<div class="lbl">Petit sac d’un gros déjà commencé</div><div class="frow">';
        ch.subs.forEach(function(b){
          h += '<button class="fchip' + (CAT.bag === b ? ' on' : '') + '" data-bag="'
             + esc(b) + '">' + esc(b) + '</button>';
        });
        h += '</div>';
      }
      if(ch.done.length){
        h += '<div class="lbl">Ou ajouter à un sac déjà fait</div><div class="frow">';
        ch.done.forEach(function(b){
          h += '<button class="fchip' + (CAT.bag === b ? ' on' : '') + '" data-bag="'
             + esc(b) + '">' + esc(b) + '</button>';
        });
        h += '</div>';
        if(ch.done.indexOf(CAT.bag) >= 0){
          h += '<div class="hint">Le sac ' + esc(CAT.bag) + ' existe déjà : les pièces s&#39;y '
             + 'ajouteront, elles ne le remplaceront pas.</div>';
        }
      }
    }

    if(CAT.stage === 'working'){
      h += '<div class="rep">' + esc(CAT.busy || '…') + '</div>';
    } else if(CAT.stage === 'segment'){
      var nEdge = CAT.boxes.filter(function(b){ return b.edge; }).length;
      h += '<div class="shotwrap"><img class="shot" id="catshot" src="' + CAT.overlay + '">'
         + '<div class="selbox" id="catsel"></div></div>';
      h += '<div class="hint"><b>' + CAT.boxes.length + ' pièce(s) découpée(s)'
         + (nEdge ? ', dont ' + nEdge + ' au bord du cadre (orange)' : '') + '.</b><br>'
         + 'Une pièce manquée ? <b>Trace un cadre autour</b> avec le doigt — une Plate 2 x 10 '
         + 'ne rentre pas dans un carré. Un simple toucher pose un petit cadre, pour une '
         + 'pièce menue. Une boîte en trop (le bord de la table, ta main) ? '
         + '<b>Touche-la pour l’enlever.</b><br>'
         + 'Mais si DEUX pièces sont dans une seule boîte, reprends la photo : c’est la seule '
         + 'erreur que rien ne rattrape plus loin. Deux plaques collées se font reconnaître '
         + 'comme une seule grande plaque, avec une bonne note — ni le score ni l’inventaire '
         + 'ne peuvent le voir. Cette validation-ci porte la justesse, ce n’est pas un '
         + 'confort.</div>';
      h += '<div class="acts"><button class="act" data-cat-retry="1">Reprendre</button>'
         + '<button class="act solid" data-cat-go="1">Identifier les ' + CAT.boxes.length
         + '</button></div>';
    } else if(CAT.stage === 'review'){
      var keep = CAT.finds.filter(function(f){ return !f.drop && f.pick; });
      var npc = keep.reduce(function(a, f){ return a + f.qty; }, 0);
      var todo = CAT.finds.filter(function(f){
        return !f.drop && findStatus(f) !== 'ok'; });
      var sure = CAT.finds.length - todo.length;

      // On ne montre que ce qui demande l'œil, de la moins sûre à la plus sûre. Les lignes
      // sûres sont justes — au-dessus de 80 % aucune n'a eu besoin d'être corrigée au premier
      // essai réel — donc les faire défiler pour trouver les sept qui comptent est du travail
      // pour rien. Elles restent atteignables d'un bouton, parce que « masqué » ne doit jamais
      // vouloir dire « inaccessible » sur des lignes qu'on s'apprête à écrire dans un .bsx.
      var shown = CAT.all ? CAT.finds.slice() : todo.slice();
      shown.sort(function(a, b){ return findRank(a) - findRank(b); });

      h += '<div class="hint"><b>' + npc + ' pièce(s) reconnue(s)</b>'
         + (todo.length ? ' · <b>' + todo.length + ' à vérifier</b>' : ' · rien à vérifier')
         + (sure ? ' · ' + sure + ' sûre(s)' + (CAT.all ? '' : ', masquée(s)') : '')
         + '.<br>Une ligne est à vérifier quand la pièce est sous ' + Math.round(SURE_ITEM * 100)
         + ' %, quand la couleur est sous ' + Math.round(SURE_COLOR * 100) + ' % sans être '
         + 'déduite, quand l’inventaire l’a repêchée au-delà du rang ' + DEEP_RANK + ', ou '
         + 'quand la découpe touche le bord. Le motif est écrit sur chacune.</div>';
      if(sure){
        h += '<div class="frow"><button class="fchip' + (CAT.all ? ' on' : '') + '" '
           + 'data-cat-all="1">' + (CAT.all ? 'Masquer les sûres' : 'Montrer les ' + sure
           + ' sûre(s)') + '</button></div>';
      }
      if(!shown.length){
        h += '<div class="done">Tout est net — rien à vérifier sur cette photo.</div>';
      }
      shown.forEach(function(f){ h += catFindHtml(f); });
      h += '<div class="acts"><button class="act" data-cat-cancel="1">Annuler la photo</button>'
         + '<button class="act solid' + (npc ? '' : ' off') + '" data-cat-add="1">'
         + 'Ajouter au sac</button></div>';
    } else {
      h += '<input type="file" id="catfile" accept="image/*" capture="environment" '
         + 'style="position:absolute;width:0;height:0;opacity:0">';
      h += '<div class="acts"><label class="act solid" for="catfile" '
         + 'style="text-align:center">📷 Prendre une photo</label></div>';
      h += '<div class="hint">Une dizaine de pièces, bien séparées, sur un fond uni qui '
         + 'contraste. Elles ne doivent pas se toucher.</div>';
    }

    if(CAT.stage === 'idle' && catPieces()){
      // La confirmation est DANS la page, pas dans une boîte du navigateur : celle-ci arrive
      // en plein milieu de l'écran, se ferme par un bouton gris minuscule, et n'a rien à
      // voir avec le reste de l'app. Deux boutons ici font le même travail sans déranger.
      if(CAT.confirm === 'close'){
        h += '<div class="rep warn">Fermer le sac ' + esc(CAT.bag) + ' avec ' + catPieces()
           + ' pièce(s) ? Le PC écrit la liste et les sort de l’inventaire.</div>'
           + '<div class="acts"><button class="act" data-cat-no="1">Non</button>'
           + '<button class="act solid" data-cat-close="1">Oui, fermer</button></div>';
      } else if(CAT.confirm === 'drop'){
        h += '<div class="rep bad">Jeter la liste du sac ' + esc(CAT.bag) + ' ? Aucun fichier '
           + 'n’a été touché, donc il n’y a rien à défaire — mais la saisie est perdue.</div>'
           + '<div class="acts"><button class="act" data-cat-no="1">Non</button>'
           + '<button class="act solid" data-cat-drop="1">Oui, jeter</button></div>';
      } else {
        h += '<div class="acts"><button class="act" data-cat-ask="drop">Jeter la liste</button>'
           + '<button class="act solid" data-cat-ask="close">Fermer la liste</button></div>';
      }
      if(CAT.saving) h += '<div class="rep">Enregistrement…</div>';
    }
    if(CAT.cmd){
      var ic = {pending:'⏳', running:'⚙', done:'✓', error:'⚠'}[CAT.cmd.status] || '';
      h += '<div class="cmd ' + CAT.cmd.status + '">' + ic + ' Fermeture du sac '
         + esc(CAT.cmd.bag || '') + ' — ' + esc(CAT.cmd.result || CAT.cmd.status) + '</div>';
    }
    h += '</div>';

    // Ce que la liste contient déjà, le dernier ajouté en premier.
    var ks = Object.keys(CAT.lots);
    if(ks.length){
      h += '<div class="card"><b style="font-size:14px">Sac ' + esc(CAT.bag) + ' — '
         + ks.length + ' lot(s)</b>';
      ks.reverse().forEach(function(k){
        var l = CAT.lots[k];
        h += '<div class="find"><img src="'
           + partImg({type:l.type || 'P', color_id:l.color, id:l.id})
           + '" onerror="this.style.visibility=&quot;hidden&quot;">'
           + '<div class="ft">' + esc(l.name || l.id) + '<span>' + esc(l.color_name || '')
           + ' · ' + esc(l.id) + '</span></div>'
           + '<span class="qty"><button data-lless="' + esc(k) + '">−</button><b>' + l.qty
           + '</b><button data-lmore="' + esc(k) + '">+</button></span></div>';
      });
      h += '</div>';
    }
    app.innerHTML = h;
    wireCat(app);
  }

  function wireCat(app){
    function find(i){ return CAT.finds.filter(function(f){ return f.i === Number(i); })[0]; }
    var f = app.querySelector('#catfile');
    if(f) f.addEventListener('change', function(){
      if(f.files && f.files[0]) catShot(f.files[0]);
      f.value = '';
    });
    app.querySelectorAll('[data-cat-back]').forEach(function(b){
      b.addEventListener('click', closeCat); });
    app.querySelectorAll('[data-cat-retry]').forEach(function(b){
      b.addEventListener('click', function(){
        CAT.stage = 'idle'; CAT.boxes = []; CAT.overlay = ''; render(); }); });
    app.querySelectorAll('[data-cat-go]').forEach(function(b){
      b.addEventListener('click', catRecognise); });
    // Tracer un cadre, ou toucher. Un simple clic ne peut pas décrire une Plate 2 x 10 :
    // il ne donne qu'un point, donc un carré de taille arbitraire, et la pièce dépasse.
    // Le tracé donne les deux choses qui manquent — la taille ET la proportion.
    var shot = app.querySelector('#catshot');
    var sel = app.querySelector('#catsel');
    if(shot && sel){
      var drag = null;
      var at = function(ev){
        var r = shot.getBoundingClientRect();
        if(!r.width || !r.height) return null;
        return {x:(ev.clientX - r.left) / r.width, y:(ev.clientY - r.top) / r.height,
                w:r.width, h:r.height};
      };
      var paint = function(a, b){
        sel.style.display = 'block';
        sel.style.left = (Math.min(a.x, b.x) * a.w) + 'px';
        sel.style.top = (Math.min(a.y, b.y) * a.h) + 'px';
        sel.style.width = (Math.abs(b.x - a.x) * a.w) + 'px';
        sel.style.height = (Math.abs(b.y - a.y) * a.h) + 'px';
      };
      shot.addEventListener('pointerdown', function(ev){
        var p = at(ev);
        if(!p || p.x < 0 || p.x > 1 || p.y < 0 || p.y > 1) return;
        drag = p;
        try{ shot.setPointerCapture(ev.pointerId); }catch(e){}
        ev.preventDefault();
      });
      shot.addEventListener('pointermove', function(ev){
        if(!drag) return;
        var p = at(ev);
        if(p) paint(drag, p);
        ev.preventDefault();
      });
      var finish = function(ev){
        if(!drag) return;
        var a = drag, b = at(ev) || drag;
        drag = null;
        sel.style.display = 'none';
        try{ shot.releasePointerCapture(ev.pointerId); }catch(e){}
        var dx = Math.abs(b.x - a.x), dy = Math.abs(b.y - a.y);
        // Un tracé minuscule est un toucher : on enlève la boîte visée, ou on en pose une
        // petite. Le seuil est en fraction de l'image, pour ne pas dépendre de l'écran.
        if(dx < 0.03 && dy < 0.03) return catTap(a.x, a.y);
        catDraw(Math.min(a.x, b.x), Math.min(a.y, b.y), dx, dy);
      };
      shot.addEventListener('pointerup', finish);
      shot.addEventListener('pointercancel', function(){
        drag = null; sel.style.display = 'none';
      });
    }
    app.querySelectorAll('[data-cat-cancel]').forEach(function(b){
      b.addEventListener('click', function(){
        CAT.stage = 'idle'; CAT.finds = []; CAT.boxes = []; CAT.overlay = ''; render(); }); });
    app.querySelectorAll('[data-cat-add]').forEach(function(b){
      b.addEventListener('click', catAddFinds); });
    app.querySelectorAll('[data-cat-close]').forEach(function(b){
      b.addEventListener('click', catClose); });
    app.querySelectorAll('[data-cat-ask]').forEach(function(b){
      b.addEventListener('click', function(){
        CAT.confirm = b.getAttribute('data-cat-ask'); render(); }); });
    app.querySelectorAll('[data-cat-no]').forEach(function(b){
      b.addEventListener('click', function(){ CAT.confirm = ''; render(); }); });
    app.querySelectorAll('[data-cat-all]').forEach(function(b){
      b.addEventListener('click', function(){ CAT.all = !CAT.all; render(); }); });
    app.querySelectorAll('[data-cat-drop]').forEach(function(b){
      b.addEventListener('click', function(){
        CAT.lots = {}; CAT.photos = 0; CAT.confirm = '';
        google.script.run.withSuccessHandler(function(){ render(); }).dropCatSession(CAT.number);
        render();
      }); });
    app.querySelectorAll('[data-bag]').forEach(function(b){
      b.addEventListener('click', function(){
        CAT.bag = b.getAttribute('data-bag'); render(); }); });
    app.querySelectorAll('[data-cand]').forEach(function(b){
      b.addEventListener('click', function(){
        var i = Number(b.getAttribute('data-cand'));
        CAT.open = (CAT.open === i) ? null : i;
        CAT.q = '';
        render();
      }); });
    app.querySelectorAll('[data-pick]').forEach(function(b){
      b.addEventListener('click', function(){
        var p = b.getAttribute('data-pick').split(':'), ff = find(p[0]);
        if(!ff) return;
        ff.pick = ff.pairs[Number(p[1])];
        ff.qty = Math.min(ff.qty, Math.max(1, catAvail(ff.pick.lot.k, ff)));
        CAT.open = null; render();
      }); });
    app.querySelectorAll('[data-manual]').forEach(function(b){
      b.addEventListener('click', function(){
        var v = b.getAttribute('data-manual'), i = v.slice(0, v.indexOf(':'));
        var k = v.slice(v.indexOf(':') + 1), ff = find(i), l = catInv()[k];
        if(!ff || !l) return;
        // Choisie à la main : la note n'a plus de sens, et la donner à 100 % laisserait
        // croire que la machine avait trouvé.
        ff.pairs = [{lot:l, si:1, cs:1, manual:true, score:1}].concat(ff.pairs || []);
        ff.pick = ff.pairs[0];
        ff.qty = 1;
        CAT.open = null; CAT.q = ''; render();
      }); });
    app.querySelectorAll('[data-more]').forEach(function(b){
      b.addEventListener('click', function(){
        var ff = find(b.getAttribute('data-more'));
        if(ff && ff.pick && catAvail(ff.pick.lot.k, ff) > ff.qty){ ff.qty++; render(); }
        else toast('L’inventaire n’en tient pas plus');
      }); });
    app.querySelectorAll('[data-less]').forEach(function(b){
      b.addEventListener('click', function(){
        var ff = find(b.getAttribute('data-less'));
        if(ff && ff.qty > 1){ ff.qty--; render(); }
      }); });
    app.querySelectorAll('[data-drop]').forEach(function(b){
      b.addEventListener('click', function(){
        var ff = find(b.getAttribute('data-drop'));
        if(ff){ ff.drop = !ff.drop; render(); }
      }); });
    app.querySelectorAll('[data-lmore]').forEach(function(b){
      b.addEventListener('click', function(){
        var k = b.getAttribute('data-lmore');
        if(catAvail(k) <= 0) return toast('L’inventaire n’en tient pas plus');
        CAT.lots[k].qty++; catSave();
      }); });
    app.querySelectorAll('[data-lless]').forEach(function(b){
      b.addEventListener('click', function(){
        var k = b.getAttribute('data-lless');
        if(!CAT.lots[k]) return;
        CAT.lots[k].qty--;
        if(CAT.lots[k].qty <= 0) delete CAT.lots[k];
        catSave();
      }); });
    var q = app.querySelector('#catq');
    if(q) q.addEventListener('input', function(){
      CAT.q = q.value;
      clearTimeout(q._t);
      q._t = setTimeout(function(){
        var at = q.selectionStart;
        render();
        var nq = document.getElementById('catq');
        if(nq){ nq.focus(); try{ nq.setSelectionRange(at, at); }catch(e){} }
      }, 250);
    });
  }

  function load(quiet){
    // `quiet` : le rechargement qui suit une demande d'envoi ne doit pas faire clignoter
    // « Chargement… » par-dessus le rapport qu'on est en train de lire.
    if(!quiet) document.getElementById('app').innerHTML = '<div class="center">Chargement&#8230;</div>';
    google.script.run.withSuccessHandler(function(data){
      SETS = data.sets || [];
      BATCHES = data.batches || [];
      // L'etat optimiste n'a plus lieu d'etre des que la vraie commande est dans la file.
      BATCHES.forEach(function(b){
        ['batch_check','batch_cfb'].forEach(function(a){
          if((b.cmds || {})[a]) delete JOBQ['b:'+b.name+':'+a];
        });
      });
      document.getElementById('asof').textContent = data.generated ? ('Mis à jour : '+data.generated.replace('T',' ')) : '';
      render();
    }).withFailureHandler(function(e){
      document.getElementById('app').innerHTML = '<div class="center">Erreur : '+esc(e.message)+'<br>Vérifie CFB_FOLDER_ID.</div>';
    }).getSets();
  }

  var modal = document.getElementById('modal');
  /** Open the purchase sheet, optionally prefilled from a buy-list row. The PRICE is never
   *  prefilled: the list carries the pre-tax shelf price, the Journal wants what you
   *  actually paid, taxes included. */
  /** Les comptes du Journal pour un numéro de set, depuis le tableau de bord : le PC les
   *  fournit PAR COPIE (convention Journal, sans les pièces en trop — pas le compte du
   *  classement). Cherché dans tout le classement, donc le bouton flottant en profite aussi.
   *  {lots, pieces} par copie, ou null si le set n'est pas au classement. */
  function journalCounts(number){
    var b = (DASH && DASH.buy_list) || {};
    var rows = (b.batch || []).concat(b.others || []);
    for(var i = 0; i < rows.length; i++){
      if(String(rows[i].number) === String(number)){
        var l = rows[i].journal_lots, q = rows[i].journal_pieces;
        if(l || q) return {lots: l || 0, pieces: q || 0};
        return null;
      }
    }
    return null;
  }

  /** Le batch auquel ce set est destine : celui que l'envoi en cours cherche a completer,
   *  que le PC nomme deja dans dashboard.json (buy_list.shipment.name). C'est la raison
   *  d'etre de l'achat, donc c'est la valeur par defaut — modifiable si on range ailleurs. */
  function targetBatch(){
    var s = (DASH && DASH.buy_list && DASH.buy_list.shipment) || {};
    return s.name ? String(s.name) : '';
  }

  function openPurchase(pre){
    pre = pre || {};
    document.getElementById('p_date').value = new Date().toISOString().slice(0,10);
    var bt = document.getElementById('p_batch');
    bt.value = targetBatch();
    updateBatchNote();
    if(pre.number) document.getElementById('p_num').value = pre.number;
    if(pre.vendor) document.getElementById('p_vendor').value = pre.vendor;
    if(pre.qty && Number(pre.qty) > 0) document.getElementById('p_qty').value = pre.qty;
    document.getElementById('p_price').value = '';
    modal.classList.remove('hidden');
  }
  /** Dire, avant de confirmer, ce que l'enregistrement va faire en plus d'ecrire au Journal. */
  function updateBatchNote(){
    var v = (document.getElementById('p_batch').value || '').trim();
    document.getElementById('p_batch_note').textContent = v
      ? 'En confirmant, le set sera automatiquement ajouté au batch ' + v
        + ', et le PC synchronisera les achats.'
      : "Laisse vide pour n'inscrire le set à aucun batch. Le PC synchronisera quand même "
        + "les achats.";
  }
  document.getElementById('p_batch').addEventListener('input', updateBatchNote);
  document.getElementById('fab').addEventListener('click', function(){ openPurchase(); });
  document.getElementById('p_cancel').addEventListener('click', function(){ modal.classList.add('hidden'); });
  document.getElementById('p_go').addEventListener('click', function(){
    var p = {
      number: document.getElementById('p_num').value.trim(),
      vendor: document.getElementById('p_vendor').value.trim() || 'Amazon',
      qty: document.getElementById('p_qty').value.trim(),
      price: (document.getElementById('p_price').value||'').replace(',','.').replace('$','').trim(),
      date: document.getElementById('p_date').value
    };
    if(!p.number || !p.qty || !p.price){ toast('Numéro, quantité et prix requis.'); return; }
    // H Lots / I Pièces. Les LOTS ne se multiplient PAS — 9 exemplaires du même set, ce
    // sont les mêmes lots (pièce + couleur) avec 9× la quantité dedans. Les PIÈCES, si, et
    // par la quantité SAISIE (on peut en acheter 5 au lieu des 9 proposés), pas celle du
    // classement. Vérifié contre les maîtres expédiés : 43011 ×9 = 219 lots / 4 788 pièces.
    p.batch = (document.getElementById('p_batch').value || '').trim();
    var jc = journalCounts(p.number);
    if(jc){
      var nq = Math.round(Number(p.qty) || 0);
      p.lots = jc.lots;
      p.pieces = jc.pieces * nq;
    }
    var go = document.getElementById('p_go'); go.disabled = true; go.textContent = '…';
    google.script.run.withSuccessHandler(function(reply){
      go.disabled=false; go.textContent='Enregistrer';
      var r = null;
      try { r = JSON.parse(String(reply)); } catch(e){ r = null; }
      if(!r || r.ok !== true){
        toast('Refusé : ' + ((r && r.error) || reply)); return;
      }
      modal.classList.add('hidden');
      document.getElementById('p_num').value=''; document.getElementById('p_price').value='';
      // Le batch est le second effet de l'enregistrement : il doit se dire, sinon on croit
      // le set inscrit alors qu'il a pu être refusé (batch fermé, déjà dans un autre).
      var msg = 'Achat enregistré au Journal ✓';
      if(r.batch){
        if(r.batch.ok) msg += (r.batch.born ? ' · envoi ' + r.batch.name + ' créé'
                                            : '')
                            + (r.batch.added ? ' · ajouté au batch ' + r.batch.name
                                             : ' · déjà au batch ' + r.batch.name);
        else msg += ' · ⚠ batch : ' + r.batch.error;
      }
      // La synchro est le troisième effet : sans elle l'achat ne descend pas dans la base
      // du PC et « reste à investir » ne bouge pas. Un refus veut presque toujours dire
      // qu'une synchro attend déjà — ça n'est pas une erreur, il faut le dire comme tel.
      if(r.sync){
        msg += r.sync.ok ? ' · synchro demandée au PC' : ' · synchro déjà en attente';
      }
      toast(msg);
      if(r.sync && r.sync.ok) schedulePoll();
      loadDash();          // the purchase moves "reste à investir" once le PC synchronise
    }).withFailureHandler(function(e){
      go.disabled=false; go.textContent='Enregistrer'; toast('Échec : '+e.message);
    }).logPurchase(p);
  });

  document.getElementById('ask_no').addEventListener('click', askClose);
  document.getElementById('ask_yes').addEventListener('click', function(){
    var go = ASK;                       // on referme AVANT d'agir : l'action peut re-rendre
    askClose();                         // la page, et la feuille resterait par-dessus
    if(go) go();
  });
  document.getElementById('askmodal').addEventListener('click', function(ev){
    if(ev.target.id === 'askmodal') askClose();      // toucher à côté = annuler
  });

  document.getElementById('phase_cancel').addEventListener('click', function(){ document.getElementById('phasemodal').classList.add('hidden'); });
  document.querySelectorAll('#phasemodal [data-phase]').forEach(function(b){
    b.addEventListener('click', function(){ setPhase(b.getAttribute('data-phase')); });
  });

  document.querySelectorAll('.tabs button').forEach(function(b){
    b.addEventListener('click', function(){ showTab(b.getAttribute('data-tab')); });
  });

  document.getElementById('reload').addEventListener('click', function(){
    if(TAB==='tri') load(); else loadDash();
  });

  document.title = TITLES[TAB];      // no title bar on the page: it lives in the tab/app name
  load();
  loadDash();
</script>
</body>
</html>
